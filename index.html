<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
<main id="room" aria-label="A dark room with Gabriel's computer">
<div id="scene" aria-hidden="true"></div><div class="vignette" aria-hidden="true"></div>
<header class="room-header"><a class="wordmark" href="index.html">GD<span> / PERSONAL SPACE</span></a><button id="skip" class="quiet">Go straight to desktop ↗</button></header>
<div class="room-caption"><span class="eyebrow">A SMALL CORNER OF MY WORLD</span><h1>Somewhere<br>after hours.</h1><p>One room. One computer.<br>A few things I've made.</p></div>
<div class="enter-prompt"><button id="enter" class="enter-button">⏻ &nbsp; Use computer <span class="key">ENTER ↵</span></button><p id="scene-status" role="status">Turning on the monitor…</p></div>
<footer class="room-footer"><span>GABRIEL DIANA<br><small>GAME DEVELOPER & UI/UX DESIGNER</small></span><span class="room-number">ROOM 001 <span class="status-dot"></span></span></footer>

<section id="desktop" hidden aria-label="Gabriel's desktop">
<div class="desktop-top"><span>GABRONI OS <small> / PERSONAL COMPUTER</small></span><button id="leave" class="quiet">← Leave computer <span class="key">ESC</span></button></div>
<nav class="desktop-icons" aria-label="Desktop folders">
<button data-app="projects"><span class="pixel-icon folder" aria-hidden="true"></span>My Projects</button>
<button data-app="about"><span class="pixel-icon document" aria-hidden="true">≡</span>About Me.txt</button>
<button data-app="skills"><span class="pixel-icon computer" aria-hidden="true">⌘</span>My Skills</button>
<button data-app="contact"><span class="pixel-icon envelope" aria-hidden="true">✉</span>Contact</button>
<button data-app="extras"><span class="pixel-icon document" aria-hidden="true">?</span>DO NOT OPEN</button>
</nav>
<div class="desktop-watermark" aria-hidden="true"><span>gd.</span><p>MADE OF CURIOSITY.<br>AND LATE NIGHTS.</p></div>
<div id="windows"></div>
<div id="start-menu" hidden><p>Gabriel Diana</p><button data-app="projects">▱ My Projects</button><button data-app="about">≡ About Me</button><button data-app="contact">✉ Contact</button><button id="start-leave">⏻ Leave computer</button></div>
<footer class="taskbar"><button id="start" aria-expanded="false" aria-controls="start-menu">▦ Start</button><div id="tasks" aria-label="Open windows"></div><time id="clock"></time></footer>
<div class="scanlines" aria-hidden="true"></div>
</section>
<noscript><div class="no-script">Explore Gabriel's portfolio: <a href="about.html">About</a> · <a href="projects.html">Projects</a> · <a href="contact.html">Contact</a>. Enable JavaScript to enter the computer.</div></noscript>
<script src="desktop.js" defer></script><script type="module" src="room.js"></script>
